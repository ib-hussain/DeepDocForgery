model:
  dct:
    stem_channels: 8
    out_channels: [16, 24, 32]
    level_names: [s8, s16, s32]
    consistency_weight: 0.10
  degradation_estimator:
    metadata_dimension: 8
    fusion_channels: [16, 24, 32]
    noise_types: [none, gaussian, poisson, speckle]
    maximum_noise_strength: 0.20
  spatial:
    out_channels: [16, 24, 32]
    level_names: [s8, s16, s32]
    channel_attention_reduction: 4
    vit:
      stem_channels: 12
      stem_depth: 1
      depths: [1, 1, 1]
      number_of_heads: [2, 3, 4]
      window_size: 4
      mlp_ratio: 2.0
      dropout: 0.0
    adn:
      stem_channels: 12
      stem_depth: 1
      depths: [1, 1, 1]
  fusion:
    out_channels: [16, 24, 32]
    attention_hidden_ratio: 0.5
    learnable_temperature: true
    refinement_depth: 1
  decoder:
    channels: 24
    class_dimension: 32
    refinement_depth: 1
    dropout: 0.0

loss:
  main_weight: 1.0
  degradation_weight: 0.25
  adn_weight: 0.25
  dct_consistency_weight: 1.0
  quality_weight: 1.0
  double_compression_weight: 1.0
  noise_type_weight: 1.0
  noise_strength_weight: 1.0
  main:
    mask_bce_weight: 1.0
    mask_dice_weight: 1.0
    image_weight: 1.0
    boundary_weight: 0.25
    auxiliary_weight: 0.4
    confidence_weight: 0.1
    denoising_weight: 0.1
    agreement_weight: 0.2
    topk_fraction: 0.02
  adn:
    text_bce_weight: 1.0
    nontext_bce_weight: 1.0
    text_decoupling_weight: 1.0
    domain_alignment_weight: 1.0
    separation_margin: 0.2

data:
  manifest: data/demo/manifest.jsonl
  image_size: [96, 128]
  batch_size: 2
  num_workers: 0
  pin_memory: false

metrics:
  mask_threshold: 0.5
  image_threshold: 0.5
  minimum_instance_area: 8
  instance_iou_threshold: 0.5

training:
  seed: 7
  epochs: 2
  learning_rate: 0.001
  minimum_learning_rate: 0.00001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  gradient_accumulation_steps: 1
  amp: false
  deterministic: true
  cpu_threads: 2
  output_dir: runs/demo
  selection_metric: pixel/f1
  save_every_epochs: 0
