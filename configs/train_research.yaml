model:
  dct:
    stem_channels: 32
    out_channels: [64, 128, 256, 384]
    level_names: [s8, s16, s32, s64]
    consistency_weight: 0.10
  degradation_estimator:
    metadata_dimension: 32
    fusion_channels: [64, 128, 256, 384]
    noise_types: [none, gaussian, poisson, speckle]
    maximum_noise_strength: 0.20
  spatial:
    out_channels: [64, 128, 256, 384]
    level_names: [s8, s16, s32, s64]
    channel_attention_reduction: 4
    vit:
      stem_channels: 48
      stem_depth: 1
      depths: [1, 2, 4, 1]
      number_of_heads: [2, 4, 8, 12]
      window_size: 8
      mlp_ratio: 4.0
      dropout: 0.0
    adn:
      stem_channels: 48
      stem_depth: 1
      depths: [1, 2, 4, 1]
  fusion:
    out_channels: [64, 128, 256, 384]
    attention_hidden_ratio: 0.5
    learnable_temperature: true
    refinement_depth: 1
  decoder:
    channels: 128
    class_dimension: 256
    refinement_depth: 2
    dropout: 0.1

loss:
  main_weight: 1.0
  degradation_weight: 0.25
  adn_weight: 0.25
  dct_consistency_weight: 1.0
  quality_weight: 1.0
  double_compression_weight: 1.0
  noise_type_weight: 1.0
  noise_strength_weight: 1.0
  main:
    mask_bce_weight: 1.0
    mask_dice_weight: 1.0
    image_weight: 1.0
    boundary_weight: 0.25
    auxiliary_weight: 0.4
    confidence_weight: 0.1
    denoising_weight: 0.1
    agreement_weight: 0.2
    topk_fraction: 0.01
  adn:
    text_bce_weight: 1.0
    nontext_bce_weight: 1.0
    text_decoupling_weight: 1.0
    domain_alignment_weight: 1.0
    separation_margin: 0.2

data:
  # Replace this after building or combining your authorized datasets.
  manifest: data/processed/combined/manifest.jsonl
  image_size: [512, 512]
  batch_size: 2
  val_batch_size: 2
  test_batch_size: 2
  num_workers: 4
  pin_memory: true
  persistent_workers: true

metrics:
  mask_threshold: 0.5
  image_threshold: 0.5
  minimum_instance_area: 16
  instance_iou_threshold: 0.5

training:
  seed: 7
  epochs: 100
  learning_rate: 0.0003
  minimum_learning_rate: 0.000001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  gradient_accumulation_steps: 4
  amp: true
  deterministic: false
  cpu_threads: 8
  output_dir: runs/research
  selection_metric: pixel/f1
  save_every_epochs: 10
